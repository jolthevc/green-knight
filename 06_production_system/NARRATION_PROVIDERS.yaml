# Green Knight Holdings
# Narration provider reference.
#
# Narration generation is currently an editor-led production step, not an n8n
# video-lifecycle workflow. This file records the default provider and access
# policy without encoding generation plumbing.
#
# NO SECRETS IN THIS FILE. API keys never belong in GitHub.

schema_version: "1.1"

default_provider: "elevenlabs"

providers:
  elevenlabs:
    enabled: true
    generation_owner: "editor"
    access_policy: "revocable workspace or seat access where supported"
    api_key_sharing_allowed: false
    notes: "Green Knight selects and locks the channel voice. The editor generates and iterates narration in-platform from the approved script during production."
