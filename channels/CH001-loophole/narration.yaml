# CH001 Loophole - narrator identity (machine-readable).
# Human-readable brief: VOICE.md section 15 and NARRATION_CALIBRATION.md.
#
# voice_id and model_id are configuration, not secrets. They stay null until a
# voice is auditioned and locked. API keys never go here.
#
# Narration is generated by the human editor during production using the locked
# channel voice. This file defines the voice; it does not trigger TTS automation.

schema_version: "1.1"

narration:
  required: true
  provider: elevenlabs
  voice_profile: loophole_narrator_v1
  # candidate | locked. Production should not begin until a required profile is locked.
  profile_status: candidate
  voice_id: null
  # Baseline model used during audition / calibration. The editor should start here.
  model_id: null
  # Baseline provider settings. Delivery may be adjusted within the channel standard.
  voice_settings: {}
  # Guidance only, not mechanically enforced.
  pace_wpm: "145-155"
  generation_owner: editor
